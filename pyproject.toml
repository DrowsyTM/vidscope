[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-analyzer"
version = "0.1.0"
description = "Bounded local video analysis through a shared API, CLI, and FastMCP tool."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "video-analyzer contributors" }
]
requires-python = ">=3.12,<3.14"
keywords = ["video", "analysis", "mcp", "fastmcp", "whisper", "tesseract", "cli", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: Pydantic :: 2",
]
dependencies = [
  "fastmcp>=3.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "yt-dlp>=2025.1.0",
  "youtube-transcript-api>=1.2.0",
]

[project.optional-dependencies]
# In video-analyzer, local ASR speech fallback mandates voice activity detection.
# Bundling silero-vad into [asr] guarantees a functional speech pipeline.
asr = [
  "faster-whisper>=1.2.0",
  "silero-vad>=6.2.0",
]
vad = [
  "silero-vad>=6.2.0",
]
all = [
  "faster-whisper>=1.2.0",
  "silero-vad>=6.2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "pillow>=10.0",
  "pre-commit>=4.0",
]

[project.scripts]
video-analyzer = "video_analyzer.cli:app"
video-analyzer-mcp = "video_analyzer.mcp:main"

[project.urls]
Homepage = "https://github.com/dima/video-analyzer"
Documentation = "https://github.com/dima/video-analyzer#readme"
Repository = "https://github.com/dima/video-analyzer.git"
Issues = "https://github.com/dima/video-analyzer/issues"
Changelog = "https://github.com/dima/video-analyzer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/video_analyzer"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
]
ignore = [
  "E501", # Line length handled by formatter
  "TID252", # Relative imports from parent modules are standard in package submodules
  "UP042", # Python 3.10 compatibility (StrEnum requires Python 3.11+)
]

[tool.ruff.lint.isort]
known-first-party = ["video_analyzer"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "video_analyzer.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["arg-type", "attr-defined", "no-untyped-def", "misc", "assignment"]

[[tool.mypy.overrides]]
module = [
  "faster_whisper.*",
  "silero_vad.*",
  "yt_dlp.*",
  "youtube_transcript_api.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
